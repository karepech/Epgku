name: Generate LIVE EVENT M3U

on:
  schedule:
    # Mengecek jadwal setiap 15 menit agar fitur Standby & Auto-Switch berjalan presisi
    - cron: "*/15 * * * *"
  # Memungkinkan Anda menjalankan script secara manual lewat tombol di GitHub
  workflow_dispatch:

jobs:
  update-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Jalankan Script Live M3U (Auto-Match & Standby Logic)
        run: |
          cd live_event
          python generate_live.py

      - name: Commit & Push File M3U
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add live_event/live_events.m3u
          git commit -m "Auto update 🔴 LIVE & UPCOMING M3U (15 Menit)" || echo "Tidak ada perubahan file"
          git push
